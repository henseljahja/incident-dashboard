# Test-classpath configuration. Does NOT shadow src/main/resources/application.yml: the two
# are separate config-data resources and both are loaded, with the .yml taking precedence for
# any key it also defines. Nothing here is redefined there.
#
# incident.jwt.secret has no default anywhere in main/ - JwtService fails fast without it - so
# the Docker-free context-load smoke test needs one supplied here. AbstractOracleIT's
# @DynamicPropertySource sets its own value at a higher precedence, so integration tests are
# unaffected by this line.
#
# This is a throwaway HS256 key for tests only. It is >= 32 bytes, which the fail-fast check
# in JwtService.<init> requires; JwtServiceTest covers the absent and too-short cases directly
# against the constructor, so the presence of a value here does not mask that guard.
incident.jwt.secret=unit-test-signing-secret-0123456789abcdef
