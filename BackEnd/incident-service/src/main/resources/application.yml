# NOTE ON DATASOURCE / FLYWAY AUTOCONFIGURATION
#
# These used to be excluded HERE, unconditionally, dating from the scaffold phase before a real
# DataSource existed. The exclusion outlived its reason: with V1-V5 and R__SeedAdmin in place, a
# real deployment booted with NO DataSource bean at all and Flyway never ran, so the schema was
# never created. Every DB bean is @Lazy, so this surfaced as a 500 per request rather than a
# startup failure -- the migrations were not failing, they were never being invoked.
#
# The exclusion now lives under the `scaffold` profile at the bottom of this file, where only the
# context-load smoke test activates it. Integration tests clear it themselves in AbstractOracleIT.
#
# Caught by the db-migration-reviewer during /straventa-code-review, 2026-08-23.

# ENVIRONMENT VARIABLES. Every setting below can be overridden from the environment -- that is how
# the container and Kubernetes deployments are configured. Spring maps UPPER_SNAKE_CASE onto the
# dotted key (incident.etl.refresh-interval-ms <- INCIDENT_ETL_REFRESH_INTERVAL_MS), so a key that
# has no ${...} placeholder here is still overridable the same way. The full list, with defaults,
# is deploy/k8s/README.md. Three settings are deliberately NOT given a value here and must come
# from the environment: the database connection (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD),
# INCIDENT_JWT_SECRET, and (first boot only) INCIDENT_ADMIN_PASSWORD -- a default would be a
# credential in source control.
server:
  port: ${SERVER_PORT:8080}
  # Behind an ingress the client's scheme and address arrive in X-Forwarded-* headers.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  # Finish in-flight requests on SIGTERM (a rolling update or scale-down) instead of cutting them.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:30s}
  application:
    name: incident-service
  flyway:
    placeholders:
      # Must be kept identical to incident.mirror.schema below. `${mirror}` inside
      # a Flyway .sql migration is a Flyway placeholder substitution — a different
      # mechanism from Spring property resolution — so both values have to be
      # updated together or migrations and app code will disagree on the schema.
      mirror: ${incident.mirror.schema}

incident:
  ai:
    # MASTER SWITCH, default false (fail-closed): /api/insights/ai/** answers 404 and no provider is
    # ever called until the provider and its data-handling terms are decided. Pair with
    # VITE_AI_INSIGHTS_LIVE=true on the frontend build.
    enabled: ${INCIDENT_AI_ENABLED:false}
    # OPTIONAL prose layer for /api/insights/ai/summary and /patterns. Everything else on the AI
    # page (figures, Q&A, search, patterns) is computed locally and never leaves the process.
    #
    # DEFAULT: none -> nothing is sent anywhere. To enable, set provider=openai AND supply
    # INCIDENT_AI_API_KEY in the environment (never in this file). Any OpenAI-compatible
    # chat-completions endpoint works via base-url.
    #
    # What is sent when enabled: aggregate counts, institusi/category names and ticket NUMBERS.
    # Ticket SUBJECTS (customer and staff names) are sent only if send-subjects=true.
    provider: ${INCIDENT_AI_PROVIDER:none}
    base-url: ${INCIDENT_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${INCIDENT_AI_API_KEY:}
    model: ${INCIDENT_AI_MODEL:gpt-4o-mini}
    send-subjects: ${INCIDENT_AI_SEND_SUBJECTS:false}
    timeout-seconds: ${INCIDENT_AI_TIMEOUT_SECONDS:20}
  cors:
    # EXPLICIT ALLOWLIST, echoed by name. Never `*`: the refresh cookie requires
    # Access-Control-Allow-Credentials: true, and a wildcard origin is incompatible with
    # credentials by specification - the browser would reject the response and
    # /auth/refresh-token could never succeed. Comma-separated; override per environment.
    allowed-origins: ${INCIDENT_CORS_ALLOWED_ORIGINS:http://localhost:5175}
  mirror:
    # FOOTGUN: this value carries its OWN trailing separator, it is not appended
    # automatically. Prod uses "REDMINE_MIRROR." (dot), the test stack uses
    # "REDMINE_MIRROR_" (underscore). Keep the separator inside the value.
    schema: ${INCIDENT_MIRROR_SCHEMA:REDMINE_MIRROR.}
  etl:
    # Rows per MERGE chunk. The watermark is advanced and the transaction committed PER
    # CHUNK, so the ~23k-row first load survives a kill instead of restarting from scratch.
    chunk-size: ${INCIDENT_ETL_CHUNK_SIZE:500}
    # Each RUN re-reads from watermark - this many seconds: a row committed at T-1s carrying
    # updated_on = T-3s would otherwise be skipped forever. Applied to the first chunk ONLY —
    # rewinding every chunk stops the loop from terminating.
    watermark-overlap-seconds: ${INCIDENT_ETL_WATERMARK_OVERLAP_SECONDS:300}
    # Master switch for SchedulingConfig. TRUE in production; AbstractOracleIT sets it FALSE
    # so a background tick cannot race MirrorFixtureLoader.resetAll() and produce tier-2
    # failures that look like real ETL bugs.
    scheduling-enabled: ${INCIDENT_ETL_SCHEDULING_ENABLED:true}
    # Incremental refresh cadence, and the first tick's delay. Also the basis of /api/freshness
    # staleness: LAST_RUN_AT older than 4x this is a stall.
    refresh-interval-ms: ${INCIDENT_ETL_REFRESH_INTERVAL_MS:120000}
    # Reconcile + prune, hourly at :15 -- offset off the hour so it does not collide with
    # whatever else the host runs on the hour.
    reconcile-cron: ${INCIDENT_ETL_RECONCILE_CRON:0 15 * * * *}
    # The OTHER half of staleness: how far the mirror's newest issues.updated_on may fall
    # behind wall clock before /api/freshness calls the data stale. This is what catches the
    # Kafka sync dying while our ETL keeps running happily over frozen data.
    mirror-lag-threshold-seconds: ${INCIDENT_ETL_MIRROR_LAG_THRESHOLD_SECONDS:3600}
  export:
    max-rows: ${INCIDENT_EXPORT_MAX_ROWS:50000}

---
# Scaffold profile — the ONLY place DataSource/Flyway autoconfiguration is disabled.
#
# Used by IncidentDashboardApplicationTests, which asserts the context loads with no database
# reachable. All three must be excluded together: excluding only DataSourceAutoConfiguration
# leaves HibernateJpa and Flyway demanding a DataSource that no longer exists, and the context
# fails to start.
#
# Do NOT activate this profile in any deployed environment. If a deploy ever boots with it on,
# the app comes up with no DataSource and no migrations, and every data request 500s.
spring:
  config:
    activate:
      on-profile: scaffold
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
