server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA history routing: /ops, /exec, /wallboard are client-side routes with no file behind
    # them. Without this fallback a browser refresh on any of them returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # TWO proxy blocks, not one, and that is load-bearing.
    #
    # AuthController maps /auth/** at the SERVLET ROOT; every data controller maps under /api/**.
    # Proxying only /api leaves login unroutable — which is exactly the defect the tier-3
    # walkthrough caught in the SPA client (it prefixed /api onto /auth/token and got a 401).
    # Same seam, same mistake available here. See .agents/patterns/api.md.
    location /api/ {
        proxy_pass http://incident-service:8080;
        include /etc/nginx/proxy_params_incident;
    }

    location /auth/ {
        proxy_pass http://incident-service:8080;
        include /etc/nginx/proxy_params_incident;
    }

    location /health {
        proxy_pass http://incident-service:8080;
        include /etc/nginx/proxy_params_incident;
    }
}
