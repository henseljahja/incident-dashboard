apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service
  labels:
    app.kubernetes.io/name: incident-service
    app.kubernetes.io/component: backend
spec:
  # Single replica by design: the ETL @Scheduled jobs have no distributed lock.
  replicas: 1
  # Never run two pods at once during a rollout (two ETLs, two Flyway runs).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-service
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: incident-dashboard
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: incident-service
          image: incident-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: incident-service-config
            - secretRef:
                name: incident-service-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          # First boot runs Flyway (V1..Vn) and can take minutes against a cold Oracle.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 72
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
